name: Publish Windows Release

on:
  workflow_run:
    workflows:
      - Build Windows installer
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Windows x64 Release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check whether this is a release commit
        id: metadata
        shell: bash
        run: |
          commit_message="$(git log -1 --format=%B)"
          version="$(node -p "require('./package.json').version")"
          if [[ "$commit_message" != "release: v"* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version is not a stable SemVer: $version" >&2
            exit 1
          fi
          notes="docs/releases/v$version.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes not found: $notes" >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the Windows installer artifact
        if: steps.metadata.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: codey-windows-x64-installer-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Create or update the GitHub Release
        if: steps.metadata.outputs.should_release == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const workspace = process.env.GITHUB_WORKSPACE;
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            const notesPath = path.join(workspace, 'docs', 'releases', `${tag}.md`);
            const assetFiles = [];

            function collectFiles(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                if (entry.isDirectory()) collectFiles(entryPath);
                else assetFiles.push(entryPath);
              }
            }

            collectFiles(path.join(workspace, 'release-assets'));
            const assetPath = assetFiles.find((candidate) => candidate.toLowerCase().endsWith('.exe'));
            if (!assetPath) throw new Error('Windows installer asset was not found.');
            if (!fs.existsSync(notesPath)) throw new Error(`Release notes were not found: ${notesPath}`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = fs.readFileSync(notesPath, 'utf8');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                tag_name: tag,
                name: `Codey ${tag}`,
                body,
                draft: false,
                prerelease: false,
                generate_release_notes: false,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: process.env.HEAD_SHA,
                name: `Codey ${tag}`,
                body,
                draft: false,
                prerelease: false,
                generate_release_notes: false,
              })).data;
            }

            const assetName = `Codey-${version}-windows-x64-setup.exe`;
            const previousAsset = release.assets.find((asset) => asset.name === assetName);
            if (previousAsset) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previousAsset.id });
            }
            const assetBuffer = fs.readFileSync(assetPath);
            const uploaded = await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data: assetBuffer,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': assetBuffer.length,
              },
            });
            core.notice(`Published ${tag}: ${uploaded.data.browser_download_url}`);
